name: Build & Publish Release Asset

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-asset:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "000:ci-dummy-token"
      ADMIN_ID: "1"
      DB_PATH: "/tmp/ci_forexyemeni.db"
      LOG_LEVEL: "INFO"
      TWELVEDATA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & run test suite
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q --junitxml=/tmp/results.xml
      - name: Report failing tests as annotations
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET
          p = '/tmp/results.xml'
          if not os.path.exists(p):
              print('::error::no results file (pytest crashed before writing)')
              raise SystemExit(0)
          root = ET.parse(p).getroot()
          n = 0
          for tc in root.iter('testcase'):
              for kind in ('failure', 'error'):
                  for f in tc.findall(kind):
                      n += 1
                      msg = (f.get('message') or '').replace('\n', ' ')[:180]
                      print(f"::error::{tc.get('classname')}::{tc.get('name')} — {msg}")
          print(f"{'no failures' if n == 0 else str(n) + ' failing test(s) reported'}")
          PYEOF
      - name: Build and verify ForexYemeni1.zip + SHA-256
        run: |
          python -c "
          import os
          from fysb import config
          tag = os.environ['GITHUB_REF_NAME']
          expected = f'v{config.VERSION}'
          assert tag == expected, f'Release tag mismatch: tag={tag!r} != config.VERSION={expected!r}!'
          print('Verified tag matches config.VERSION:', expected)
          "
          git archive --format=zip --prefix=ForexYemeni_Bot/ -o ForexYemeni1.zip HEAD
          python -c "
          import pathlib, updater
          zp = pathlib.Path('ForexYemeni1.zip')
          assert updater.validate_package(zp), 'invalid release archive'
          sha = updater.sha256_file(zp)
          pathlib.Path('ForexYemeni1.zip.sha256').write_text(f'{sha}  ForexYemeni1.zip\n')
          print('Built ForexYemeni1.zip:', zp.stat().st_size, 'bytes | sha256:', sha)
          "
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ForexYemeni1.zip ForexYemeni1.zip.sha256 --clobber
          else
            gh release create "$TAG" ForexYemeni1.zip ForexYemeni1.zip.sha256 \
              --title "$TAG" --generate-notes
          fi
